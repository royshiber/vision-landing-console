openapi: 3.1.0
info:
  title: Jetson Companion API
  version: "1"
  summary: Aircraft-side companion contract for VisionLandingConsole.
  description: |
    Source of truth is Jetson Companion Core (`src/companion/`).
    Design only — no server is implemented.

    Safety tiers (x-safety-tier): READ_ONLY | RUNTIME_WRITE | FLIGHT_CRITICAL | NOT_SUPPORTED.
    Flight-control commands, UART, systemd, and raw GStreamer are not part of this API.
  license:
    name: Proprietary

servers:
  - url: http://127.0.0.1:{port}/api/v1
    description: Future local loopback (port TBD; not UI :4010)
    variables:
      port:
        default: "8472"
  - url: http://100.82.59.45:{port}/api/v1
    description: Future Tailscale bind (not public WWAN)
    variables:
      port:
        default: "8472"

tags:
  - name: meta
  - name: status
  - name: vision
  - name: navigation
  - name: landing
  - name: video
  - name: config
  - name: policy
  - name: events
  - name: maintenance

x-not-supported:
  - ARM
  - DISARM
  - SET_MODE
  - LAND
  - COMMAND_LONG
  - UART
  - systemd
  - GStreamer control
  - POST /policy/apply

paths:
  /health:
    get:
      tags: [meta]
      operationId: getHealth
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      summary: Process liveness (not FC heartbeat)
      responses:
        "200":
          description: Companion process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /version:
    get:
      tags: [meta]
      operationId: getVersion
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      responses:
        "200":
          description: API and companion versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /status:
    get:
      tags: [status]
      operationId: getStatus
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      summary: Aggregate CompanionStatus plus FC/channels/landing summaries
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionStatus"

  /status/system:
    get:
      tags: [status]
      operationId: getSystemStatus
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      responses:
        "200":
          description: SystemStatus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"

  /status/fc:
    get:
      tags: [status]
      operationId: getFcStatus
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      summary: Projection of inbound MAVLink cache, not a second estimator
      responses:
        "200":
          description: FcStatus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FcStatus"

  /network/uplinks:
    get:
      tags: [status]
      operationId: getNetworkUplinks
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      summary: Read-only Wi-Fi and Huawei cellular uplink snapshot. No enable or disable.
      responses:
        "200":
          description: UplinkStatus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UplinkStatus"

  /status/mavlink:
    get:
      tags: [status]
      operationId: getMavlinkStatus
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      responses:
        "200":
          description: MavlinkStatus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MavlinkStatus"

  /status/channels:
    get:
      tags: [status]
      operationId: getChannels
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      responses:
        "200":
          description: Communication channels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelsStatus"

  /status/vision:
    get:
      tags: [vision]
      operationId: getVisionStatus
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      responses:
        "200":
          description: VisionStatus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisionStatus"

  /status/cameras:
    get:
      tags: [vision]
      operationId: getCamerasStatus
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      summary: Honest per-slot camera status for cam1, cam2, and cam3
      responses:
        "200":
          description: CamerasStatus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CamerasStatus"

  /status/gimbal:
    get:
      tags: [vision]
      operationId: getGimbalStatus
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      summary: SIYI gimbal snapshot. present is true only after a fresh reply.
      responses:
        "200":
          description: GimbalStatus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GimbalStatus"

  /cameras/{id}/frame:
    get:
      tags: [vision]
      operationId: getCameraFrame
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      summary: Latest JPEG for one slot. Missing frame is 404, never a placeholder.
      parameters:
        - $ref: "#/components/parameters/CameraId"
      responses:
        "200":
          description: JPEG bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: אין פריים

  /cameras/{id}/frame.jpg:
    get:
      tags: [vision]
      operationId: getCameraFrameJpg
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      parameters:
        - $ref: "#/components/parameters/CameraId"
      responses:
        "200":
          description: JPEG bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: אין פריים

  /gimbal/rate:
    post:
      tags: [vision]
      operationId: postGimbalRate
      x-safety-tier: RUNTIME_WRITE
      x-mutability: RUNTIME_WRITE
      summary: Yaw/pitch rate. Not a flight command. Disabled unless explicitly enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GimbalRateCommand"
      responses:
        "200":
          description: Ack or sent
        "403":
          description: Control disabled

  /gimbal/angle:
    post:
      tags: [vision]
      operationId: postGimbalAngle
      x-safety-tier: RUNTIME_WRITE
      x-mutability: RUNTIME_WRITE
      summary: Absolute yaw/pitch, clamped to A8 limits. Command id defaults to 0x0E.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GimbalAngleCommand"
      responses:
        "200":
          description: Ack or sent
        "403":
          description: Control disabled

  /gimbal/center:
    post:
      tags: [vision]
      operationId: postGimbalCenter
      x-safety-tier: RUNTIME_WRITE
      x-mutability: RUNTIME_WRITE
      responses:
        "200":
          description: Center sent
        "403":
          description: Control disabled

  /gimbal/zoom:
    post:
      tags: [vision]
      operationId: postGimbalZoom
      x-safety-tier: RUNTIME_WRITE
      x-mutability: RUNTIME_WRITE
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GimbalZoomCommand"
      responses:
        "200":
          description: Zoom sent
        "403":
          description: Control disabled

  /gimbal/mode:
    post:
      tags: [vision]
      operationId: postGimbalMode
      x-safety-tier: RUNTIME_WRITE
      x-mutability: RUNTIME_WRITE
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GimbalModeCommand"
      responses:
        "200":
          description: Mode sent
        "403":
          description: Control disabled

  /gimbal/photo:
    post:
      tags: [vision]
      operationId: postGimbalPhoto
      x-safety-tier: RUNTIME_WRITE
      x-mutability: RUNTIME_WRITE
      responses:
        "200":
          description: Photo packet sent. The SDK does not ack this command.
        "403":
          description: Control disabled

  /gimbal/record:
    post:
      tags: [vision]
      operationId: postGimbalRecord
      x-safety-tier: RUNTIME_WRITE
      x-mutability: RUNTIME_WRITE
      responses:
        "200":
          description: Record toggle sent. The SDK does not ack this command.
        "403":
          description: Control disabled

  /vision/result:
    get:
      tags: [vision]
      operationId: getVisionResult
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      summary: Latest VisionResult; stale is unavailable, never silently current
      responses:
        "200":
          description: VisionResult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisionResult"

  /status/navigation:
    get:
      tags: [navigation]
      operationId: getNavigationStatus
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      responses:
        "200":
          description: NavigationStatus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationStatus"

  /navigation/estimate:
    get:
      tags: [navigation]
      operationId: getNavEstimate
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      summary: Internal NavEstimate only; not injected into ArduPilot
      responses:
        "200":
          description: NavEstimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavEstimate"

  /status/landing:
    get:
      tags: [landing]
      operationId: getLandingStatus
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      responses:
        "200":
          description: LandingTargetResult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandingTargetResult"

  /status/video:
    get:
      tags: [video]
      operationId: getVideoStatus
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      summary: Pipeline metadata only; no stream URL protocol chosen
      responses:
        "200":
          description: VideoStatus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoStatus"

  /diagnostics:
    get:
      tags: [status]
      operationId: getDiagnostics
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      responses:
        "200":
          description: Diagnostics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsSnapshot"

  /maintenance:
    get:
      tags: [maintenance]
      operationId: getMaintenance
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      summary: Read-only software, system, companion, and recent diagnostic maintenance view
      description: |
        Jetson-side source of truth only. Does not include VisionLandingConsole UI version.
        Aggregates existing /version, /status/system, and structured runtime diagnostic audit data.
        No write, deploy, restart, or service-control operations.
      responses:
        "200":
          description: MaintenanceStatus snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceStatus"

  /config:
    get:
      tags: [config]
      operationId: getConfig
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      responses:
        "200":
          description: Full CompanionConfig (writes still tier-gated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionConfig"

  /config/runtime:
    patch:
      tags: [config]
      operationId: patchRuntimeConfig
      x-safety-tier: RUNTIME_WRITE
      x-mutability: RUNTIME_WRITE
      summary: Non-flight-critical runtime keys only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeConfigPatch"
            example:
              runtime:
                min_detection_confidence: 0.4
                vision_stale_timeout_s: 0.5
                log_level: INFO
      responses:
        "200":
          description: Updated CompanionConfig
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionConfig"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /policy:
    get:
      tags: [policy]
      operationId: getPolicy
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      responses:
        "200":
          description: Project policy YAML as JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MavlinkPolicy"
    put:
      tags: [policy]
      operationId: putPolicy
      x-safety-tier: RUNTIME_WRITE
      x-mutability: RUNTIME_WRITE
      summary: Validate and save project policy; does not apply to /etc or restart router
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MavlinkPolicy"
      responses:
        "200":
          description: Saved intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyWriteResponse"
        "400":
          $ref: "#/components/responses/Error"

  /policy/preview:
    get:
      tags: [policy]
      operationId: previewPolicy
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      summary: mavlink-router snippet from current policy; never writes /etc
      responses:
        "200":
          description: Snippet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyPreview"

  /policy/apply:
    post:
      tags: [policy]
      operationId: applyPolicy
      x-safety-tier: NOT_SUPPORTED
      x-mutability: NOT_SUPPORTED
      summary: Not supported in v1 (would write /etc and restart mavlink-router)
      responses:
        "501":
          $ref: "#/components/responses/Error"

  /command/{name}:
    post:
      tags: [status]
      operationId: forbiddenCommand
      x-safety-tier: NOT_SUPPORTED
      x-mutability: NOT_SUPPORTED
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [arm, disarm, set_mode, land]
      responses:
        "403":
          $ref: "#/components/responses/Error"

  /events:
    get:
      tags: [events]
      operationId: streamEventsSse
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      summary: SSE stream of EventEnvelope
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/EventEnvelope"

  /ws:
    get:
      tags: [events]
      operationId: streamEventsWs
      x-safety-tier: READ_ONLY
      x-mutability: READ_ONLY
      summary: WebSocket; same EventEnvelope JSON as SSE
      responses:
        "101":
          description: Switching Protocols

components:
  parameters:
    CameraId:
      name: id
      in: path
      required: true
      schema:
        type: string
        enum: [cam1, cam2, cam3]
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    CameraSlotState:
      type: string
      enum: [absent, opening, streaming, read_failed, opencv_unavailable, csi_requires_gstreamer_opencv, disabled]

    CameraSlot:
      type: object
      required: [id, camera_ok, state]
      properties:
        id:
          type: string
          enum: [cam1, cam2, cam3]
        role:
          type: string
          enum: [forward, down, gimbal]
        enabled: { type: boolean }
        state: { $ref: "#/components/schemas/CameraSlotState" }
        present: { type: boolean }
        camera_ok: { type: boolean }
        fps: { type: number, nullable: true }
        frame_count: { type: integer, nullable: true }
        last_frame_age_ms: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        source: { type: string, nullable: true }
        real: { type: boolean }
        dry_run: { type: boolean }
        resolved_device: { type: string, nullable: true }
        requested_device: { type: string, nullable: true }
        has_frame: { type: boolean }

    CamerasStatus:
      type: object
      required: [ok, camera_ok, cameras]
      properties:
        ok: { type: boolean }
        observe_only: { type: boolean }
        camera_ok: { type: boolean }
        real: { type: boolean }
        dry_run: { type: boolean }
        source: { type: string }
        fps: { type: number, nullable: true }
        frame_count: { type: integer, nullable: true }
        last_frame_age_ms: { type: integer, nullable: true }
        cameras:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CameraSlot"
        slots:
          type: array
          items: { type: string }

    GimbalStatus:
      type: object
      required: [ok, present]
      properties:
        ok: { type: boolean }
        present: { type: boolean }
        firmware: { type: object, nullable: true }
        hardware_id: { type: string, nullable: true }
        attitude: { type: object, nullable: true }
        zoom: { type: number, nullable: true }
        mode:
          type: string
          nullable: true
          enum: [lock, follow, fpv, null]
        recording: { type: boolean, nullable: true }
        age_ms: { type: integer, nullable: true }
        control_enabled: { type: boolean }
        error: { type: string, nullable: true }

    GimbalRateCommand:
      type: object
      required: [yaw, pitch]
      properties:
        yaw: { type: integer, minimum: -100, maximum: 100 }
        pitch: { type: integer, minimum: -100, maximum: 100 }

    GimbalAngleCommand:
      type: object
      required: [yaw, pitch]
      properties:
        yaw: { type: number, minimum: -135, maximum: 135 }
        pitch: { type: number, minimum: -90, maximum: 25 }

    GimbalZoomCommand:
      type: object
      properties:
        zoom: { type: integer, minimum: -1, maximum: 1 }
        direction:
          type: string
          enum: [in, out, stop]

    GimbalModeCommand:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [lock, follow, fpv]

    HealthState:
      type: string
      enum: [unavailable, degraded, valid]

    Validity:
      type: string
      enum: [invalid, stale, valid]

    Timestamped:
      type: object
      additionalProperties: false
      required: [t_monotonic_ns]
      properties:
        t_monotonic_ns:
          type: integer
          format: int64
        t_utc_ns:
          type: [integer, "null"]
          format: int64

    Quality:
      type: object
      additionalProperties: false
      required: [confidence]
      properties:
        confidence:
          type: number
          minimum: 0
          maximum: 1
        label:
          type: string
          default: ""

    Diagnostics:
      type: object
      additionalProperties: false
      properties:
        data:
          type: object
          additionalProperties: true

    Vec3:
      type: array
      minItems: 3
      maxItems: 3
      items:
        type: number

    FrameId:
      type: string
      enum: [camera_optical, body_frd, body_flu, ned_local, wgs84, target]

    UplinkStatus:
      type: object
      additionalProperties: false
      required: [ok, read_only, wifi, cellular]
      properties:
        ok: { type: boolean }
        read_only: { type: boolean }
        default_iface: { type: [string, "null"] }
        wifi:
          type: object
          additionalProperties: false
          properties:
            iface: { type: [string, "null"] }
            up: { type: boolean }
            ssid: { type: [string, "null"] }
            signal_dbm: { type: [number, "null"] }
            ip: { type: [string, "null"] }
            default_route: { type: boolean }
        cellular:
          type: object
          additionalProperties: false
          properties:
            iface: { type: [string, "null"] }
            up: { type: boolean }
            ip: { type: [string, "null"] }
            route_metric: { type: [integer, "null"] }
            default_route: { type: boolean }
            signal:
              type: [object, "null"]
              additionalProperties: true

    HealthResponse:
      type: object
      required: [ok, api_version]
      properties:
        ok:
          type: boolean
        api_version:
          type: string
          example: "1"
        capabilities:
          type: object
          properties:
            uplinkStatus: { type: boolean }

    VersionResponse:
      type: object
      required: [api_version, companion_version]
      properties:
        api_version:
          type: string
        companion_version:
          type: string
          example: "0.1.0"

    SystemStatus:
      type: object
      additionalProperties: false
      properties:
        cpu_percent: { type: [number, "null"] }
        ram_used_mb: { type: [number, "null"] }
        ram_total_mb: { type: [number, "null"] }
        gpu_percent: { type: [number, "null"] }
        temperature_c: { type: [number, "null"] }
        disk_used_percent: { type: [number, "null"] }

    MavlinkStatus:
      type: object
      additionalProperties: false
      properties:
        router_running: { type: boolean }
        connected: { type: boolean }
        heartbeat_ok: { type: boolean }
        messages_sent: { type: integer }
        messages_received: { type: integer }
        messages_dropped:
          type: [integer, "null"]
          description: Optional; for UI packet-loss. Null until counted.
        rx_drop_rate:
          type: [number, "null"]
        last_heartbeat:
          oneOf:
            - $ref: "#/components/schemas/Timestamped"
            - type: "null"

    VisionStatus:
      type: object
      additionalProperties: false
      properties:
        running: { type: boolean }
        health: { $ref: "#/components/schemas/HealthState" }
        fps: { type: [number, "null"] }
        latency_ms: { type: [number, "null"] }
        last_valid:
          oneOf:
            - $ref: "#/components/schemas/Timestamped"
            - type: "null"
        quality: { $ref: "#/components/schemas/Quality" }
        camera_ok: { type: boolean }
        source_id: { type: string }

    NavigationStatus:
      type: object
      additionalProperties: false
      properties:
        active_source: { type: string }
        health: { $ref: "#/components/schemas/HealthState" }
        validity: { $ref: "#/components/schemas/Validity" }
        quality: { $ref: "#/components/schemas/Quality" }
        last_update:
          oneOf:
            - $ref: "#/components/schemas/Timestamped"
            - type: "null"

    VideoStatus:
      type: object
      additionalProperties: false
      properties:
        raw_pipeline: { type: string }
        annotated_pipeline: { type: string }
        raw_fps: { type: [number, "null"] }
        annotated_fps: { type: [number, "null"] }
        bitrate_kbps: { type: [number, "null"] }
        raw_kind:
          type: string
          const: raw
        annotated_kind:
          type: string
          const: annotated

    CachedMessage:
      type: object
      required: [validity]
      properties:
        validity: { $ref: "#/components/schemas/Validity" }
        timestamp:
          oneOf:
            - $ref: "#/components/schemas/Timestamped"
            - type: "null"
        system_id: { type: [integer, "null"] }
        component_id: { type: [integer, "null"] }
        fields:
          type: object
          additionalProperties: true

    FcStatus:
      type: object
      description: View over TelemetryCache; not a Core domain class
      additionalProperties: false
      properties:
        heartbeat: { $ref: "#/components/schemas/CachedMessage" }
        sys_status: { $ref: "#/components/schemas/CachedMessage" }
        attitude: { $ref: "#/components/schemas/CachedMessage" }
        global_position_int: { $ref: "#/components/schemas/CachedMessage" }
        armed:
          type: [boolean, "null"]
          description: Derived from HEARTBEAT base_mode if present; observe-only. Null when the autopilot heartbeat is not fresh.
        custom_mode: { type: [integer, "null"] }
        status: { type: [string, "null"] }
        connected: { type: [boolean, "null"] }
        heartbeat_validity: { type: [string, "null"] }
        mode: { type: [string, "null"] }
        autopilot: { type: [integer, "null"] }
        system_id: { type: [integer, "null"] }
        component_id: { type: [integer, "null"] }
        load_pct: { type: [number, "null"] }
        loadPct: { type: [number, "null"] }
        battery_v: { type: [number, "null"] }
        battery_pct: { type: [integer, "null"] }
        battery_source: { type: [string, "null"] }
        meminfo_free_kb: { type: [number, "null"] }
        mcu_temp_c: { type: [number, "null"] }
        temperature_c: { type: [number, "null"] }
        last_heartbeat_age_ms: { type: [integer, "null"] }

    ChannelStatus:
      type: object
      properties:
        id: { type: string }
        implementation: { type: string }
        jetson_in_path: { type: boolean }
        listening: { type: [boolean, "null"] }
        bind: { type: [string, "null"] }
        notes: { type: string }

    ChannelsStatus:
      type: object
      required: [rc, rfd900x, gcs_tailscale, vision_loopback]
      properties:
        rc:
          $ref: "#/components/schemas/ChannelStatus"
        rfd900x:
          $ref: "#/components/schemas/ChannelStatus"
        gcs_tailscale:
          $ref: "#/components/schemas/ChannelStatus"
        vision_loopback:
          $ref: "#/components/schemas/ChannelStatus"

    Detection:
      type: object
      required: [label, detection_id, confidence]
      properties:
        label: { type: string }
        detection_id:
          oneOf:
            - type: integer
            - type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        bbox_px:
          type: [array, "null"]
          minItems: 4
          maxItems: 4
          items: { type: number }
        corners_px:
          type: [array, "null"]
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
        metadata:
          type: object
          additionalProperties: true

    LandingTargetMeasurement:
      type: object
      required: [angle_x_rad, angle_y_rad, distance_m, position_valid]
      properties:
        angle_x_rad: { type: number }
        angle_y_rad: { type: number }
        distance_m: { type: number }
        frame:
          $ref: "#/components/schemas/FrameId"
        target_num: { type: integer }
        landing_type: { type: integer }
        position_m:
          oneOf:
            - $ref: "#/components/schemas/Vec3"
            - type: "null"
        position_valid:
          type: boolean
          default: false
        marker_id: { type: [integer, "null"] }

    VisionResult:
      type: object
      required: [timestamp, source, validity, quality, health, frame_id]
      properties:
        timestamp: { $ref: "#/components/schemas/Timestamped" }
        source: { type: string }
        validity: { $ref: "#/components/schemas/Validity" }
        quality: { $ref: "#/components/schemas/Quality" }
        health: { $ref: "#/components/schemas/HealthState" }
        frame_id: { type: integer }
        detections:
          type: array
          items: { $ref: "#/components/schemas/Detection" }
        landing_target:
          oneOf:
            - $ref: "#/components/schemas/LandingTargetMeasurement"
            - type: "null"
        latency_ms: { type: [number, "null"] }
        diagnostics: { $ref: "#/components/schemas/Diagnostics" }

    LandingTargetResult:
      type: object
      required: [timestamp, source, validity, quality]
      properties:
        timestamp: { $ref: "#/components/schemas/Timestamped" }
        source: { type: string }
        validity: { $ref: "#/components/schemas/Validity" }
        quality: { $ref: "#/components/schemas/Quality" }
        target:
          oneOf:
            - $ref: "#/components/schemas/LandingTargetMeasurement"
            - type: "null"
        detections:
          type: array
          items: { $ref: "#/components/schemas/Detection" }

    NavEstimate:
      type: object
      required: [timestamp, source, validity, quality]
      properties:
        timestamp: { $ref: "#/components/schemas/Timestamped" }
        source: { type: string }
        validity: { $ref: "#/components/schemas/Validity" }
        quality: { $ref: "#/components/schemas/Quality" }
        position_m:
          oneOf:
            - $ref: "#/components/schemas/Vec3"
            - type: "null"
        velocity_m_s:
          oneOf:
            - $ref: "#/components/schemas/Vec3"
            - type: "null"
        attitude_rpy_rad:
          oneOf:
            - $ref: "#/components/schemas/Vec3"
            - type: "null"
        position_frame: { $ref: "#/components/schemas/FrameId" }
        attitude_frame: { $ref: "#/components/schemas/FrameId" }
        covariance:
          type: [array, "null"]
          items: { type: number }
        metadata:
          type: object
          additionalProperties: true

    CompanionStatus:
      type: object
      required: [timestamp, system, mavlink, vision, navigation, video]
      properties:
        timestamp: { $ref: "#/components/schemas/Timestamped" }
        system: { $ref: "#/components/schemas/SystemStatus" }
        mavlink: { $ref: "#/components/schemas/MavlinkStatus" }
        vision: { $ref: "#/components/schemas/VisionStatus" }
        navigation: { $ref: "#/components/schemas/NavigationStatus" }
        video: { $ref: "#/components/schemas/VideoStatus" }
        fc: { $ref: "#/components/schemas/FcStatus" }
        channels: { $ref: "#/components/schemas/ChannelsStatus" }
        landing: { $ref: "#/components/schemas/LandingTargetResult" }
        extras:
          type: object
          additionalProperties: true

    CameraExtrinsics:
      type: object
      x-safety-tier: READ_ONLY
      properties:
        rotation_rpy_rad: { $ref: "#/components/schemas/Vec3" }
        translation_m: { $ref: "#/components/schemas/Vec3" }
        body_frame: { $ref: "#/components/schemas/FrameId" }

    ArucoConfig:
      type: object
      properties:
        dictionary_name: { type: string }
        marker_ids:
          type: array
          items: { type: integer }
        marker_length_m: { type: number }
        fx: { type: number }
        fy: { type: number }
        cx: { type: number }
        cy: { type: number }
        hfov_deg: { type: number }
        target_num: { type: integer }
        landing_type: { type: integer }
        frame: { $ref: "#/components/schemas/FrameId" }

    CompanionConfig:
      type: object
      properties:
        static:
          type: object
          x-safety-tier: READ_ONLY
          additionalProperties: true
        runtime:
          type: object
          x-safety-tier: RUNTIME_WRITE
          additionalProperties: true
        flight_critical:
          type: object
          x-safety-tier: FLIGHT_CRITICAL
          additionalProperties: true
        read_only:
          type: object
          x-safety-tier: READ_ONLY
          additionalProperties: true
        camera_extrinsics:
          oneOf:
            - $ref: "#/components/schemas/CameraExtrinsics"
            - type: "null"
        aruco:
          oneOf:
            - $ref: "#/components/schemas/ArucoConfig"
            - type: "null"
        vision:
          type: object
          additionalProperties: true

    RuntimeConfigPatch:
      type: object
      additionalProperties: false
      properties:
        runtime:
          type: object
          additionalProperties: false
          properties:
            vision_stale_timeout_s:
              type: number
              exclusiveMinimum: 0
            log_level:
              type: string
              enum: [DEBUG, INFO, WARNING, ERROR]
            min_detection_confidence:
              type: number
              minimum: 0
              maximum: 1
        vision:
          type: object
          additionalProperties: false
          properties:
            default_source:
              type: string
              enum: [synthetic, replay, csi]
        aruco:
          type: object
          additionalProperties: false
          properties:
            aruco_dict: { type: string }
            marker_ids:
              type: array
              items: { type: integer }

    MavlinkPolicyChannel:
      type: object
      additionalProperties: true
      properties:
        implementation: { type: string }
        endpoint: { type: string }
        mode: { type: string }
        deny:
          type: array
          items: { type: string }
        deny_in:
          type: array
          items: { type: string }
        deny_out:
          type: array
          items: { type: string }
        allow:
          type: array
          items: { type: string }
        notes: { type: string }

    MavlinkPolicy:
      type: object
      required: [version, channels]
      properties:
        version: { type: integer }
        channels:
          type: object
          required: [gcs_4g, rfd900x]
          properties:
            gcs_4g: { $ref: "#/components/schemas/MavlinkPolicyChannel" }
            rfd900x: { $ref: "#/components/schemas/MavlinkPolicyChannel" }

    PolicyWriteResponse:
      type: object
      required: [ok, applied]
      properties:
        ok: { type: boolean }
        applied:
          type: boolean
          description: Always false in v1
        path: { type: string }

    PolicyPreview:
      type: object
      properties:
        snippet: { type: string }
        writes_etc: { type: boolean, const: false }

    DiagnosticsSnapshot:
      type: object
      properties:
        timestamp: { $ref: "#/components/schemas/Timestamped" }
        diagnostics: { $ref: "#/components/schemas/Diagnostics" }
        subsystems:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HealthState"

    DiagnosticEvent:
      type: object
      required: [subsystem, health, message]
      properties:
        subsystem:
          type: string
          enum: [system, vision, navigation, landing, mavlink, video, policy, config, api]
        health: { $ref: "#/components/schemas/HealthState" }
        message: { type: string }
        timestamp: { $ref: "#/components/schemas/Timestamped" }
        diagnostics: { $ref: "#/components/schemas/Diagnostics" }

    MaintenanceSoftware:
      type: object
      additionalProperties: false
      required: [companion_version]
      properties:
        companion_version:
          type: string
          example: "0.1.0"
        git_commit:
          type: [string, "null"]
          description: HEAD commit SHA from the Jetson repository working tree
        git_branch:
          type: [string, "null"]
          description: Current branch name, or null when detached
        git_clean:
          type: [boolean, "null"]
          description: |
            Best-effort clean hint without shell execution. null when unknown.
        changed_files_count:
          type: [integer, "null"]
          description: Optional dirty-file count; null when not safely obtainable

    MaintenanceCompanion:
      type: object
      additionalProperties: false
      required: [api_version, api_running]
      properties:
        api_version:
          type: string
          const: "1"
        api_running:
          type: boolean
          description: True when this Companion API process is serving the request

    MaintenanceDiagnostics:
      type: object
      additionalProperties: false
      required: [recent]
      properties:
        recent:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/DiagnosticEvent"

    MaintenanceStatus:
      type: object
      additionalProperties: false
      required: [timestamp, software, system, companion, diagnostics]
      properties:
        timestamp: { $ref: "#/components/schemas/Timestamped" }
        software: { $ref: "#/components/schemas/MaintenanceSoftware" }
        system: { $ref: "#/components/schemas/SystemStatus" }
        companion: { $ref: "#/components/schemas/MaintenanceCompanion" }
        diagnostics: { $ref: "#/components/schemas/MaintenanceDiagnostics" }

    EventEnvelope:
      type: object
      required: [api_version, event, timestamp, payload]
      properties:
        api_version:
          type: string
          const: "1"
        event:
          type: string
          enum: [status, vision, mavlink, navigation, landing, diagnostics]
        timestamp: { $ref: "#/components/schemas/Timestamped" }
        payload:
          description: Schema depends on event (status→CompanionStatus, vision→VisionResult, …)

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - validation_error
            - not_supported
            - forbidden
            - stale
            - unavailable
            - not_found
        message: { type: string }
        details:
          type: array
          items: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }
